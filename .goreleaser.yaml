version: 2

before:
  hooks:
    - make web

# Runs on a macOS runner (see .github/workflows/release.yml): the macOS menu
# bar icon needs cgo, which only a Mac can build. Windows and Linux builds
# are pure Go.
# Dev builds (goreleaser build --snapshot, see dev-build.yml) are versioned
# after the next minor release, e.g. 0.3.0-develop.202610111530.abc1234 after
# v0.2.0: develop works towards the next minor release, and hotfix releases
# (v0.2.1, made from a release/v0.2 branch) never share a number with a dev
# build. dev-build.yml sets DEV_LABEL to <branch>.<commit time>.<commit>, so
# builds of one branch sort by commit time; local snapshots fall back to
# dev.<commit>.
snapshot:
  version_template: '{{ incminor .Version }}-{{ if index .Env "DEV_LABEL" }}{{ .Env.DEV_LABEL }}{{ else }}dev.{{ .ShortCommit }}{{ end }}'

builds:
  - id: darwin
    main: ./cmd/worldkeeper
    env: [CGO_ENABLED=1]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

  - id: windows
    main: ./cmd/worldkeeper
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    # GUI subsystem: no console window next to the tray icon. CLI commands
    # attach to the calling terminal at runtime.
    ldflags: ["-s -w -H=windowsgui -X main.version={{.Version}}"]

  - id: linux
    main: ./cmd/worldkeeper
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

# Worldkeeper.app for macOS: one universal binary (arm64 + x86_64) from the
# darwin builds, put into an app bundle by tools/macapp and zipped as
# Worldkeeper_<version>_macOS.zip, which the release and checksums.txt pick
# up as extra files. GoReleaser's own app bundles are a Pro feature.
# The per-architecture darwin archives stay (replace: false) for the command
# line. Builds without darwin binaries (dev-build.yml) skip this step.
universal_binaries:
  - id: darwin-universal
    ids: [darwin]
    hooks:
      post:
        - cmd: >-
            go run ./tools/macapp -binary '{{ .Path }}' -version {{ .Version }}
            -app dist/Worldkeeper.app -zip dist/Worldkeeper_{{ .Version }}_macOS.zip
          output: true

archives:
  - ids: [darwin, windows, linux] # not darwin-universal: it ships as the app
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: "dist/Worldkeeper_{{ .Version }}_macOS.zip"

# The release notes are generated: this header, the changelog below, then the
# footer with the downloads. Nothing is written by hand.
release:
  extra_files:
    - glob: "dist/Worldkeeper_{{ .Version }}_macOS.zip"
  header: |
    Automatic backups for Minecraft: Java Edition worlds, taken when you exit a world.

    > **Status:** a personal project, shared as-is. There are no guarantees on support or response time.
  footer: |
    ## Install

    Download the archive for your system, unpack it, and run `worldkeeper`. The web UI opens at `http://127.0.0.1:25599` on the first start. To upgrade, quit Worldkeeper from the tray and replace the program; your settings and saves stay where they are.

    | System | Download |
    |---|---|
    | Windows (most PCs) | `worldkeeper_{{ .Version }}_windows_amd64.zip` |
    | Windows on ARM | `worldkeeper_{{ .Version }}_windows_arm64.zip` |
    | macOS (Apple Silicon and Intel) | `Worldkeeper_{{ .Version }}_macOS.zip`: unzip and move `Worldkeeper.app` to Applications |
    | macOS, bare binary | `worldkeeper_{{ .Version }}_darwin_arm64.tar.gz` / `worldkeeper_{{ .Version }}_darwin_amd64.tar.gz` |
    | Linux | `worldkeeper_{{ .Version }}_linux_amd64.tar.gz` / `worldkeeper_{{ .Version }}_linux_arm64.tar.gz` |

    **The binaries are not signed:**
    - **Windows:** SmartScreen warns on the first run. Click *More info → Run anyway*.
    - **macOS:** right-click `Worldkeeper.app` → *Open* on the first launch (on macOS 15 and later: *System Settings → Privacy & Security → Open Anyway*). For the bare binary, clear the quarantine flag: `xattr -d com.apple.quarantine ./worldkeeper`.

    See the [README](https://github.com/dkrasiev/worldkeeper#readme) for setup, and [all changes](https://github.com/dkrasiev/worldkeeper/compare/{{ .PreviousTag }}...{{ .Tag }}) since {{ .PreviousTag }}.

# The changelog is built from the squashed pull request titles, which use
# Conventional Commits ("feat: …", "fix: …"), one line per pull request
# ("feat: compare a save with the current world (#68)"). Changes that users
# do not see (docs, tests, CI, chores) are left out.
changelog:
  use: git
  format: "{{ .Message }}"
  sort: asc
  filters:
    exclude:
      - '^(docs|test|ci|chore|style|refactor)(\(.+\))?!?:'
      - "^Merge "
  groups:
    - title: New features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^(fix|perf)(\(.+\))?!?:'
      order: 1
    - title: Other changes
      order: 999

# Opens a pull request with the new version's manifests in
# microsoft/winget-pkgs, from the fork dkrasiev/winget-pkgs. Needs the
# WINGET_TOKEN secret: a classic token with the public_repo scope (it pushes
# to the fork and opens the pull request upstream; a fine-grained token
# cannot reach microsoft/winget-pkgs). Without it the step is skipped and
# the release still succeeds.
winget:
  - name: Worldkeeper
    package_identifier: dkrasiev.Worldkeeper
    publisher: Dmitry Krasiev
    publisher_url: https://github.com/dkrasiev
    publisher_support_url: https://github.com/dkrasiev/worldkeeper/issues
    author: Dmitry Krasiev
    homepage: https://github.com/dkrasiev/worldkeeper
    license: MIT
    license_url: https://github.com/dkrasiev/worldkeeper/blob/main/LICENSE
    release_notes_url: "https://github.com/dkrasiev/worldkeeper/releases/tag/{{ .Tag }}"
    short_description: Automatic backups for Minecraft Java Edition worlds, taken when you exit a world.
    description: |-
      Worldkeeper backs up your Minecraft: Java Edition worlds the moment you exit them in the game, to any folder (a NAS share, an external drive, a cloud-sync folder) or a restic repository.
      It finds worlds from the official launcher, Prism Launcher, CurseForge and the Modrinth App, shows what is in each world and each save, and restores any save in place or as a new world.
      It runs in the system tray with a local web UI.
    tags: [backup, minecraft, minecraft-java, restic, world-backup]
    skip_upload: '{{ if not (index .Env "WINGET_TOKEN") }}true{{ end }}'
    repository:
      owner: dkrasiev
      name: winget-pkgs
      branch: "dkrasiev.Worldkeeper-{{ .Version }}"
      token: '{{ index .Env "WINGET_TOKEN" }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
