version: 2

before:
  hooks:
    - make web

# Runs on a macOS runner (see .github/workflows/release.yml): the macOS menu
# bar icon needs cgo, which only a Mac can build. Windows and Linux builds
# are pure Go.
builds:
  - id: darwin
    main: ./cmd/worldkeeper
    env: [CGO_ENABLED=1]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

  - id: windows
    main: ./cmd/worldkeeper
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    # GUI subsystem: no console window next to the tray icon. CLI commands
    # attach to the calling terminal at runtime.
    ldflags: ["-s -w -H=windowsgui -X main.version={{.Version}}"]

  - id: linux
    main: ./cmd/worldkeeper
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github

# Opens a pull request with the new version's manifests in
# microsoft/winget-pkgs, from the fork dkrasiev/winget-pkgs. Needs the
# WINGET_TOKEN secret (a token that can push to that fork); without it the
# step is skipped and the release still succeeds.
winget:
  - name: Worldkeeper
    package_identifier: dkrasiev.Worldkeeper
    publisher: Dmitry Krasiev
    publisher_url: https://github.com/dkrasiev
    publisher_support_url: https://github.com/dkrasiev/worldkeeper/issues
    author: Dmitry Krasiev
    homepage: https://github.com/dkrasiev/worldkeeper
    license: MIT
    license_url: https://github.com/dkrasiev/worldkeeper/blob/main/LICENSE
    release_notes_url: "https://github.com/dkrasiev/worldkeeper/releases/tag/{{ .Tag }}"
    short_description: Automatic backups for Minecraft Java Edition worlds, taken when you exit a world.
    description: |-
      Worldkeeper backs up your Minecraft: Java Edition worlds the moment you exit them in the game, to any folder (a NAS share, an external drive, a cloud-sync folder) or a restic repository.
      It finds worlds from the official launcher, Prism Launcher, CurseForge and the Modrinth App, shows what is in each world and each save, and restores any save in place or as a new world.
      It runs in the system tray with a local web UI.
    tags: [backup, minecraft, minecraft-java, restic, world-backup]
    skip_upload: '{{ if not (index .Env "WINGET_TOKEN") }}true{{ end }}'
    repository:
      owner: dkrasiev
      name: winget-pkgs
      branch: "dkrasiev.Worldkeeper-{{ .Version }}"
      token: '{{ index .Env "WINGET_TOKEN" }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
