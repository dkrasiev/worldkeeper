name: Dev build

# A Windows x64 test build for every pull request and every push to develop,
# made once per commit: a commit that already has a build artifact (e.g. a
# PR head that later lands on develop unchanged) is not built again.
# Re-running a run is the exception: GitHub deletes the earlier attempt's
# artifacts, so a re-run builds again (useful when a build needs repeating).
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to look up existing artifacts

concurrency:
  # One build per commit at a time; a second run for the same commit waits,
  # then finds the artifact and skips.
  group: dev-build-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  # Build the commit itself, not the temporary PR merge commit (which gets a
  # new SHA every time the base branch moves).
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-amd64:
    runs-on: ubuntu-latest # pure Go cross-compile; no cgo needed for Windows
    outputs:
      built: ${{ steps.existing.outputs.skip != 'true' }}
      artifact: ${{ steps.existing.outputs.name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Already built?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="worldkeeper-windows-amd64-${COMMIT}"
          count=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${name}" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          if [ "${count}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit ${COMMIT} already has a build (${name}); skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0 # GoReleaser derives the version from tags
      - uses: actions/setup-go@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: 24

      # The version names the branch, e.g. 0.3.0-develop.202610111530.abc1234
      # or 0.3.0-feat-autostart.…: lowercase, anything but [0-9a-z-] becomes
      # "-". The commit time (UTC) orders builds of one branch for the app's
      # update check.
      - name: Version label
        if: steps.existing.outputs.skip != 'true'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          branch=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^0-9a-z-]/-/g' -e 's/^-*//' -e 's/-*$//')
          when=$(TZ=UTC git log -1 --date=format-local:%Y%m%d%H%M --format=%cd "$COMMIT")
          echo "DEV_LABEL=${branch:-build}.${when}.$(git rev-parse --short=7 "$COMMIT")" >> "$GITHUB_ENV"

      # Same build settings as releases (GUI subsystem, version stamp), only
      # the windows/amd64 target.
      - uses: goreleaser/goreleaser-action@v6
        if: steps.existing.outputs.skip != 'true'
        with:
          version: "~> v2"
          args: build --snapshot --clean --single-target --id windows
        env:
          GOOS: windows
          GOARCH: amd64

      - name: Version
        id: version
        if: steps.existing.outputs.skip != 'true'
        run: echo "version=$(jq -r .version dist/metadata.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          name: ${{ steps.existing.outputs.name }}
          path: dist/windows_windows_amd64_v1/worldkeeper.exe
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: steps.existing.outputs.skip != 'true'
        run: |
          {
            echo "### Windows x64 test build ${{ steps.version.outputs.version }}"
            echo
            echo "Commit \`${COMMIT}\`. Download \`worldkeeper.exe\` from **Artifacts** below (kept for 14 days). Test build, not a release."
          } >> "$GITHUB_STEP_SUMMARY"

  # Every push to develop replaces the "dev" pre-release with its build, so it
  # can be downloaded without signing in to GitHub; Worldkeeper offers it on
  # the "Test builds" update channel. Pull request builds stay artifacts.
  publish:
    needs: windows-amd64
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.windows-amd64.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to replace the release
      actions: read # to download the build
    concurrency:
      group: dev-release
      cancel-in-progress: true # the newest push wins
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-amd64.outputs.artifact }}
      - name: Replace the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows-amd64.outputs.version }}
        run: |
          # The app reads the version from the title and downloads this
          # archive by name (internal/update).
          zip -j worldkeeper_windows_amd64.zip worldkeeper.exe
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev worldkeeper_windows_amd64.zip \
            --prerelease --latest=false --target "$COMMIT" \
            --title "Dev build ${VERSION}" \
            --notes "Test build of \`develop\` at ${COMMIT}, for Windows x64. Not a release: it may have bugs. Worldkeeper offers it when **Settings → Offer updates** is set to **Test builds**."
          echo "Published [Dev build ${VERSION}](https://github.com/${GH_REPO}/releases/tag/dev)." >> "$GITHUB_STEP_SUMMARY"
