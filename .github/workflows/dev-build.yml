name: Dev build

# A Windows x64 test build for every pull request and every push to main,
# made once per commit: a commit that already has a build artifact (e.g. a
# PR head that later lands on main unchanged) is not built again.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to look up existing artifacts

concurrency:
  # One build per commit at a time; a second run for the same commit waits,
  # then finds the artifact and skips.
  group: dev-build-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  # Build the commit itself, not the temporary PR merge commit (which gets a
  # new SHA every time the base branch moves).
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-amd64:
    runs-on: ubuntu-latest # pure Go cross-compile; no cgo needed for Windows
    steps:
      - name: Already built?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="worldkeeper-windows-amd64-${COMMIT}"
          count=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${name}" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          if [ "${count}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit ${COMMIT} already has a build (${name}); skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0 # GoReleaser derives the version from tags
      - uses: actions/setup-go@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: 24

      # Same build settings as releases (GUI subsystem, version stamp), only
      # the windows/amd64 target.
      - uses: goreleaser/goreleaser-action@v6
        if: steps.existing.outputs.skip != 'true'
        with:
          version: "~> v2"
          args: build --snapshot --clean --single-target --id windows
        env:
          GOOS: windows
          GOARCH: amd64

      - name: Version
        id: version
        if: steps.existing.outputs.skip != 'true'
        run: echo "version=$(jq -r .version dist/metadata.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          name: ${{ steps.existing.outputs.name }}
          path: dist/windows_windows_amd64_v1/worldkeeper.exe
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: steps.existing.outputs.skip != 'true'
        run: |
          {
            echo "### Windows x64 test build ${{ steps.version.outputs.version }}"
            echo
            echo "Commit \`${COMMIT}\`. Download \`worldkeeper.exe\` from **Artifacts** below (kept for 14 days). Test build, not a release."
          } >> "$GITHUB_STEP_SUMMARY"
