name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # cgo for the macOS menu bar icon
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Test build tags (dev, dev-<branch>) can sit on the same commit;
          # the release is the pushed tag.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Optional: lets GoReleaser open the winget-pkgs pull request.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
